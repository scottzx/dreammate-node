# 每次 push / PR 都跑：agent 最怕的是回环限制被改坏、探活静默失效。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck:all
      - run: npm run test:all
      - run: npm run build:all
      - run: node scripts/check-package-boundary.mjs
