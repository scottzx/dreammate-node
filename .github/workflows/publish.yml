# 发布 @1agents/dreammate-node 到 npm。
#
# 触发：推一个 v* tag（例如 v0.1.0），或在 Actions 页手动 Run workflow。
# tag 上的版本号必须与 package.json 对得上，否则直接失败——版本对不上的包
# 发出去就收不回来了。
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包不发布'
        type: boolean
        default: false

permissions:
  contents: read
  # npm provenance 需要它来签发 OIDC 令牌。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test（schema 与 types 的一致性、三条硬规则）
        run: npm test

      - name: Build
        run: npm run build

      - name: tag 与 package.json 的版本必须一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致"
            exit 1
          fi
          echo "版本一致：$pkg"

      - name: Pack（先看清楚要发什么）
        run: npm pack --dry-run

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
