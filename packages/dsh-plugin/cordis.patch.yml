- insert:
    - id: dreammate-node
      name: '@1agents/dreammate-node'
      config:
        serviceMode: auto
        serviceUrl: http://127.0.0.1:36908

# Yima phone/browser entry over Tailscale Serve: trust exactly one private
# `host:port` authority in the Connection carrier. Shipped disabled; a profile
# patch enables it and replaces the config wholesale with its real authority:
#   - id: yima-tailnet-trust
#     disabled: false
#     config:
#       authority: "scott-mac.tailfb4720.ts.net:3080"
- insert:
    - id: yima-tailnet-trust
      name: './yima-tailnet-trust.mjs'
      disabled: true
      config:
        authority: ''

# Yima shared loopback entry for the desktop profile's own web server:
# Tailscale Serve proxies the phone/browser to this loopback port so requests
# share the desktop session writer, and slims /api/remote.mux and session page
# payloads for low-bandwidth remote links by default. Shipped disabled; a
# profile patch enables it and supplies its loopback host and port:
#   - id: yima-shared-loopback
#     disabled: false
#     config:
#       host: 127.0.0.1
#       port: 3466
- insert:
    - id: yima-shared-loopback
      name: './yima-shared-loopback.mjs'
      disabled: true
      config:
        host: 127.0.0.1
        port: 0
